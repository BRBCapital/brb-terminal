# /etc/nginx/sites-available/brb-analyst  (symlink into sites-enabled)
# TLS reverse proxy for BRB NGX Analyst. TLS is MANDATORY — the session cookie
# is issued Secure in production and will not persist over plain HTTP.
#
# Certbot path:  sudo certbot --nginx -d analyst.brbcapital.example
#
# If you instead terminate TLS at an AWS ALB (ACM cert), you can drop the ssl_*
# lines and listen on 80 here — but the ALB MUST forward X-Forwarded-Proto=https
# (default for HTTPS listeners) so the app keeps the cookie Secure.

server {
    listen 80;
    server_name analyst.brbcapital.example;
    # Let certbot answer ACME challenges, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name analyst.brbcapital.example;

    ssl_certificate     /etc/letsencrypt/live/analyst.brbcapital.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analyst.brbcapital.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Filing extraction streams multi-MB PDFs; AI reports stream for minutes —
    # allow a generous body + long read/send timeouts (must exceed the app's
    # maxDuration of up to 300s on AI routes).
    client_max_body_size 25m;
    proxy_read_timeout   320s;
    proxy_send_timeout   320s;
    proxy_buffering      off;   # don't buffer streamed NDJSON/SSE AI responses

    # NOTE: security headers (CSP, HSTS, X-Frame-Options: DENY, nosniff,
    # Referrer-Policy, Permissions-Policy) are set at the APP tier in
    # next.config.mjs. Do NOT re-add them here — nginx duplicates would
    # double up and X-Frame-Options SAMEORIGIN would contradict the app's DENY.

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;   # REQUIRED for Secure cookies
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
